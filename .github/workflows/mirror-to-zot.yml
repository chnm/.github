name: Mirror images to Zot

on:
 workflow_call:
   inputs:
     images:
       description: 'Newline/space-separated image refs to mirror (e.g. ghcr.io/org/repo/img:tag)'
       required: true
       type: string
     source_registry:
       default: 'ghcr.io'
       type: string
     dest_registry:
       default: 'oci.rrchnm.internal'
       type: string
     parallelism:
       default: 4
       type: number

# One mirror at a time per caller+ref — the self-hosted runner has finite pull
# bandwidth, and overlapping runs are what let a newer run cancel an in-flight one.
concurrency:
 group: mirror-to-zot-${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: false

jobs:
 mirror:
   name: mirror
   runs-on: [self-hosted, linux]        # <-- RECONCILE with your actual runner label(s)
   timeout-minutes: 30
   steps:
     - name: Login to source (GHCR)
       run: crane auth login "${{ inputs.source_registry }}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

     # If Zot needs auth, add it here, e.g.:
     # - name: Login to dest (Zot)
     #   run: crane auth login "${{ inputs.dest_registry }}" -u "${{ secrets.ZOT_USER }}" -p "${{ secrets.ZOT_PASSWORD }}"

     - name: Mirror (parallel + retry)
       env:
         SRC: ${{ inputs.source_registry }}
         DST: ${{ inputs.dest_registry }}
         IMAGES: ${{ inputs.images }}
         PAR: ${{ inputs.parallelism }}
         GATE: '0'   # set to '1' to fail the pipeline if any copy fails
       run: |
         set -uo pipefail

         # Normalize the ref list (space OR newline separated); keep only SRC refs; dedupe.
         refs="$(printf '%s\n' $IMAGES | sed '/^[[:space:]]*$/d;/^(none)$/d' | grep "^$SRC/" | sort -u || true)"
         if [ -z "$refs" ]; then echo "no $SRC refs to mirror"; exit 0; fi

         # crane copy one ref, with 3 retries + linear backoff. Prints OK/FAIL <dst>.
         copy_one() {
           s="$1"; d="$DST/${s#$SRC/}"; n=0
           until crane copy "$s" "$d"; do
             n=$((n+1))
             if [ "$n" -ge 3 ]; then echo "FAIL $d"; return 1; fi
             echo "retry $n: $s" >&2; sleep $((n*5))
           done
           echo "OK   $d"
         }
         export -f copy_one; export SRC DST

         # Fan out the copies. `xargs` exit code is non-zero if any copy_one failed.
         log="$(mktemp)"
         printf '%s\n' $refs | xargs -r -P "$PAR" -I{} bash -c 'copy_one "$1"' _ {} | tee "$log"
         xrc=${PIPESTATUS[0]}

         {
           echo "### Zot mirror ($SRC → $DST)"
           echo '```'
           cat "$log"
           echo '```'
         } >> "$GITHUB_STEP_SUMMARY" || true

         if grep -q '^FAIL' "$log" || [ "${xrc:-0}" != 0 ]; then
           echo "::warning title=Zot mirror::one or more copies failed"
           [ "$GATE" = '1' ] && exit 1 || exit 0
         fi
         exit 0
