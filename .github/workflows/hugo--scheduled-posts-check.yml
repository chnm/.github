name: Hugo Scheduled Posts Check Reusable Workflow

# Decides whether a scheduled (cron) run has anything to publish.
#
# A Hugo site with future-dated content only goes live when something rebuilds
# it, so these repos run a daily cron. This workflow keeps that cron from
# rebuilding and re-releasing the site every single day: it answers "did any
# content cross its publishDate (or expiryDate) since the last successful
# scheduled run?" and lets the caller gate its build job on the answer.
#
# Non-schedule events (push, workflow_dispatch) always answer "true", so normal
# pushes are never gated.
#
# Notes on the inputs that carry sharp edges:
#
#   content-roots   Newline- or comma-separated, relative to context-root.
#                   Pass "content" to scan a whole content tree. If NONE of the
#                   roots exist the job fails loudly -- a typo here would
#                   otherwise mean the cron silently stops publishing forever.
#
#   timezone        Front-matter dates written without a UTC offset
#                   (publishDate: 2026-08-13) mean whatever Hugo's `timeZone`
#                   setting says they mean. If a site sets `timeZone`, set this
#                   to match: otherwise a post can be judged publishable here
#                   but not by Hugo, and it is never reconsidered on a later run.
#
#   workflow-file   The run history that defines the window is the CALLING
#                   workflow's. Auto-detected from GITHUB_WORKFLOW_REF, which
#                   refers to the caller even inside a reusable workflow, so
#                   repos whose workflow is not named cicd.yml work unchanged.
#
# Usage:
#
#   jobs:
#     check:
#       uses: chnm/.github/.github/workflows/hugo--scheduled-posts-check.yml@main
#       permissions:
#         actions: read      # read the calling workflow's own run history
#         contents: read
#       with:
#         content-roots: |
#           content/blog
#           content/publications
#
#     build-release:
#       needs: check
#       if: needs.check.outputs.has_new == 'true'
#       uses: chnm/.github/.github/workflows/hugo--build-release.yml@main
#       ...

on:
  workflow_call:
    inputs:
      content-roots:                      # content dirs to scan, relative to
        required: true                    # context-root; newline- or
        type: string                      # comma-separated
      context-root:                       # hugo site root; use the subdir name
        required: false                   # for monorepos, default is the repo
        type: string                      # root
        default: "."

      workflow-file:                      # filename of the CALLING workflow;
        required: false                   # auto-detected when empty, set only
        type: string                      # if that detection is wrong
        default: ""
      fallback-days:                      # lookback window when no previous
        required: false                   # successful scheduled run is known;
        type: number                      # covers the Fri->Mon gap plus a
        default: 4                        # dropped best-effort cron

      timezone:                           # IANA zone for front-matter dates
        required: false                   # written without a UTC offset; must
        type: string                      # match the site's Hugo `timeZone`
        default: "UTC"
      skip-drafts:                        # ignore `draft: true`; hugo would not
        required: false                   # publish those anyway
        type: boolean
        default: true
      check-expiry:                       # also rebuild when an `expiryDate` has
        required: false                   # passed, so expired content actually
        type: boolean                     # leaves the live site
        default: true

      runner_labels:                      # JSON array of labels for the check
        required: false                   # job; the scan is cheap and needs no
        type: string                      # site tooling
        default: '["ubuntu-latest"]'

    outputs:
      has_new:
        description: "'true' when the site should be rebuilt."
        value: ${{ jobs.check.outputs.has_new }}
      since:
        description: "Start of the scanned window, ISO-8601 UTC (empty for non-schedule events)."
        value: ${{ jobs.check.outputs.since }}

jobs:

  check:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    outputs:
      has_new: ${{ steps.scan.outputs.has_new }}
      since: ${{ steps.scan.outputs.since }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: '${{ github.repository }}'   # the invoking repository

      - name: Scan content for newly publishable posts
        id: scan
        env:
          # Everything reaches the script through the environment; no `${{ }}`
          # is interpolated into the script body.
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          CONTENT_ROOTS: ${{ inputs.content-roots }}
          CONTEXT_ROOT: ${{ inputs.context-root }}
          WORKFLOW_FILE: ${{ inputs.workflow-file }}
          FALLBACK_DAYS: ${{ inputs.fallback-days }}
          SITE_TIMEZONE: ${{ inputs.timezone }}
          SKIP_DRAFTS: ${{ inputs.skip-drafts }}
          CHECK_EXPIRY: ${{ inputs.check-expiry }}
        run: |
          python3 - << 'PY'
          import json, os, re, sys, urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          def emit(**kv):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  for key, value in kv.items():
                      f.write(f"{key}={value}\n")

          def summarize(line):
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a") as f:
                      f.write(line + "\n")

          def flag(name, default=False):
              return (os.environ.get(name) or str(default)).strip().lower() == "true"

          # ---------------------------------------------------------------
          # Non-schedule triggers (push, manual) always build.
          # ---------------------------------------------------------------
          event = os.environ.get("EVENT_NAME", "")
          if event != "schedule":
              print(f"event '{event}' is not a scheduled run -- building unconditionally")
              emit(has_new="true", since="")
              sys.exit(0)

          now = datetime.now(timezone.utc)

          try:
              from zoneinfo import ZoneInfo
              local_tz = ZoneInfo(os.environ.get("SITE_TIMEZONE") or "UTC")
          except Exception as exc:
              print(f"::warning::unusable timezone ({exc}); falling back to UTC")
              local_tz = timezone.utc

          # ---------------------------------------------------------------
          # Window start. A post is "newly publishable" only if its date passed
          # since the previous successful scheduled run -- that run already
          # considered everything up to its own start time. Fall back to a
          # fixed lookback when the API is unreachable or there is no prior run.
          # ---------------------------------------------------------------
          fallback_days = float(os.environ.get("FALLBACK_DAYS") or 4)
          since = now - timedelta(days=fallback_days)

          # The run history that matters is the CALLING workflow's, not this
          # one's. GITHUB_WORKFLOW_REF looks like
          #   owner/repo/.github/workflows/cicd.yml@refs/heads/main
          # and refers to the caller even inside a reusable workflow.
          workflow_file = (os.environ.get("WORKFLOW_FILE") or "").strip()
          if not workflow_file:
              ref = os.environ.get("GITHUB_WORKFLOW_REF", "")
              workflow_file = ref.split("@")[0].rsplit("/", 1)[-1]

          if not workflow_file:
              print(f"could not determine the calling workflow file; {fallback_days:g}-day fallback: {since.isoformat()}")
          else:
              try:
                  url = (
                      f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/workflows/{workflow_file}/runs"
                      "?event=schedule&status=success&per_page=1"
                  )
                  req = urllib.request.Request(url, headers={
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      runs = json.load(resp).get("workflow_runs", [])
                  if runs:
                      since = datetime.fromisoformat(
                          runs[0]["run_started_at"].replace("Z", "+00:00")
                      ).astimezone(timezone.utc)
                      print(f"since = last successful scheduled run of {workflow_file}: {since.isoformat()}")
                  else:
                      print(f"no prior successful scheduled run of {workflow_file}; {fallback_days:g}-day fallback: {since.isoformat()}")
              except Exception as exc:
                  print(f"run-history lookup failed ({exc}); {fallback_days:g}-day fallback: {since.isoformat()}")

          # ---------------------------------------------------------------
          # Front matter parsing. Restricted to the leading delimited block so
          # a line in the body cannot masquerade as a date field.
          # ---------------------------------------------------------------
          FRONT_MATTER = (
              re.compile(r"\A---\r?\n(.*?)\r?\n---\s*(\r?\n|\Z)", re.S),        # YAML
              re.compile(r"\A\+\+\+\r?\n(.*?)\r?\n\+\+\+\s*(\r?\n|\Z)", re.S),  # TOML
          )

          def front_matter(path):
              # Front matter is at the top; avoid reading whole files in large
              # repos, and only fall back to a full read if the closing
              # delimiter is not in the first chunk.
              with path.open("r", errors="replace") as f:
                  head = f.read(65536)
              text = head.lstrip("﻿")
              for pattern in FRONT_MATTER:
                  match = pattern.match(text)
                  if match:
                      return match.group(1)
              if len(head) < 65536:
                  return ""
              text = path.read_text(errors="replace").lstrip("﻿")
              for pattern in FRONT_MATTER:
                  match = pattern.match(text)
                  if match:
                      return match.group(1)
              return ""

          def field(block, *names):
              # Case-insensitive because Hugo lowercases front-matter keys
              # internally; `:` for YAML, `=` for TOML.
              for name in names:
                  match = re.search(rf'^\s*{name}\s*[:=]\s*(.+?)\s*$', block, re.M | re.I)
                  if match:
                      return match.group(1).strip().strip("\"'")
              return ""

          def parse(value):
              value = value.strip().strip("\"'")
              if not value:
                  return None
              parsed = None
              for candidate in (value, value.replace("Z", "+00:00"), value.replace(" ", "T", 1)):
                  try:
                      parsed = datetime.fromisoformat(candidate)
                      break
                  except ValueError:
                      continue
              if parsed is None:
                  for fmt in ("%Y-%m-%d", "%Y-%m-%d %H:%M:%S", "%Y-%m-%dT%H:%M:%S%z"):
                      try:
                          parsed = datetime.strptime(value, fmt)
                          break
                      except ValueError:
                          continue
              if parsed is None:
                  return None
              # Dates written without an offset mean whatever the site's
              # `timeZone` says they mean.
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=local_tz)
              return parsed.astimezone(timezone.utc)

          # ---------------------------------------------------------------
          # Scan.
          # ---------------------------------------------------------------
          skip_drafts = flag("SKIP_DRAFTS", True)
          check_expiry = flag("CHECK_EXPIRY", True)

          base = Path(os.environ.get("CONTEXT_ROOT") or ".")
          roots = [r.strip() for r in re.split(r"[,\n]", os.environ.get("CONTENT_ROOTS", "")) if r.strip()]
          if not roots:
              print("::error::no content-roots given")
              sys.exit(1)

          triggers, missing, scanned = [], [], 0
          for root in roots:
              directory = base / root
              if not directory.is_dir():
                  missing.append(str(directory))
                  continue
              paths = set()
              for pattern in ("*.md", "*.markdown", "*.html"):
                  paths.update(directory.rglob(pattern))
              for path in sorted(paths):
                  block = front_matter(path)
                  if not block:
                      continue
                  scanned += 1
                  if skip_drafts and field(block, "draft").lower() == "true":
                      continue
                  published = parse(field(block, "publishdate"))
                  if published and since < published <= now:
                      triggers.append((path, "publishDate", published))
                  if check_expiry:
                      expired = parse(field(block, "expirydate", "unpublishdate"))
                      if expired and since < expired <= now:
                          triggers.append((path, "expiryDate", expired))

          # A misspelled root is worse than a failure: the cron would silently
          # never publish anything. Fail when nothing at all is scannable.
          if missing:
              print(f"::warning::content root(s) not found: {', '.join(missing)}")
          if len(missing) == len(roots):
              print("::error::none of the given content-roots exist; check `content-roots` / `context-root`")
              sys.exit(1)

          for path, reason, when in triggers:
              print(f"{reason} reached: {path} ({when.isoformat()})")

          has_new = "true" if triggers else "false"
          print(f"scanned {scanned} file(s) with front matter across {len(roots) - len(missing)} root(s) -> has_new={has_new}")

          summarize(f"### Scheduled posts check: `{has_new}`\n")
          summarize(f"Window: `{since.isoformat()}` -> `{now.isoformat()}`\n")
          if triggers:
              summarize("| File | Field | Date |")
              summarize("| --- | --- | --- |")
              for path, reason, when in triggers:
                  summarize(f"| `{path}` | {reason} | {when.isoformat()} |")
          else:
              summarize("No content crossed its `publishDate`/`expiryDate` in this window; build skipped.")

          emit(has_new=has_new, since=since.isoformat())
          PY
